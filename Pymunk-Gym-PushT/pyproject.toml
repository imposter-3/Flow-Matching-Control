[project]
name = "pymunk-gym-pusht"
version = "1.0.0"
description = "Flow matching action-chunk policies on state-based Push-T: four methods, one table"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "gym-pusht>=0.1.6",
    "gymnasium>=1.0.0",
    "numpy>=2.0.0",
    # The physics engine behind gym-pusht. Pymunk 7 changes contact behavior,
    # which would move every trajectory, so the major version is pinned.
    "pymunk>=6.6,<7",
    # The published numbers were produced under torch 2.13; kernel changes in
    # later minors can break bit-exact reproduction, so stay on that minor.
    "torch>=2.13,<2.14",
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pusht_flow"]

[tool.ruff]
target-version = "py311"
line-length = 88
