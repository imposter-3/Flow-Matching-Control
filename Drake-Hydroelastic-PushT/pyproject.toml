[project]
name = "drake-hydroelastic-pusht"
version = "1.0.0"
description = "Flow matching action-chunk policies on Drake hydroelastic Push-T with a KUKA iiwa14"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The simulator the numbers were produced under; contact behavior moves
    # between drake versions, so the version is pinned exactly.
    "drake==1.48.0",
    # The published numbers were produced under torch 2.13; kernel changes in
    # later minors can break bit-exact reproduction, so stay on that minor.
    "torch>=2.13,<2.14",
    "numpy>=2.5,<2.6",
    # Environment config loading.
    "pyyaml>=6.0",
    # B-spline chunk construction.
    "scipy>=1.14",
    # The training corpus reader.
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pusht_drake"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
